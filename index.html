<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Jepe Fried Chicken</title>
    <style>
        :root { --primary: #d32f2f; --secondary: #fbc02d; --bg: #f4f4f4; }
        body { font-family: 'Arial', sans-serif; background: var(--bg); padding: 10px; color: #333; }
        .container { max-width: 450px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        
        h2 { color: var(--primary); text-align: center; font-size: 1rem; margin-bottom: 5px; }
        .date-header { text-align: center; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid var(--secondary); padding-bottom: 10px; font-size: 0.85rem; }
        
        .section-title { font-weight: bold; font-size: 0.9rem; margin: 15px 0 10px 0; color: #555; text-transform: uppercase; border-left: 4px solid var(--primary); padding-left: 8px; }
        
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .row label { flex: 1; font-size: 0.85rem; text-transform: capitalize; }
        .row input { width: 100px; padding: 6px; border: 1px solid #ddd; border-radius: 4px; text-align: right; font-size: 0.85rem; }

        .total-box { margin-top: 15px; padding: 10px; background: #fffde7; border-radius: 6px; border: 1px solid var(--secondary); font-weight: bold; text-align: right; }
        
        .sisa-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; padding: 4px 0; border-bottom: 1px solid #eee; }
        .sisa-row span { font-size: 0.85rem; }
        .sisa-row .input-group { display: flex; align-items: center; }
        .sisa-row input { width: 50px; padding: 4px; text-align: center; margin-right: 5px; border: 1px solid #ddd; border-radius: 4px; }

        .actions { margin-top: 25px; display: grid; gap: 10px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .btn-save { background: #555; color: white; }
        .btn-copy { background: #25d366; color: white; font-size: 1rem; } /* Warna Hijau WA */
        .btn-copy:active { transform: scale(0.98); }
        .btn-reset { background: #eee; color: #999; font-size: 0.75rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>OMSET PENJUALAN AYAM BOOTH<br>JEPE FRIED CHICKEN</h2>
    <div class="date-header" id="displayDate"></div>

    <div class="section-title">Omset Area Timur</div>
    <div id="omsetForm"></div>

    <div class="total-box">
        TOTAL: <span id="grandTotal">Rp0</span>
    </div>

    <div class="section-title">Sisa Goreng (Pcs)</div>
    <div id="sisaForm"></div>

    <div class="actions">
        <button class="btn-copy" onclick="copyReport()">📋 SALIN LAPORAN KE WA</button>
        <button class="btn-save" onclick="saveData(true)">💾 SIMPAN DATA SAJA</button>
        <button class="btn-reset" onclick="resetData()">Reset Data ke Awal</button>
    </div>
</div>

<script>
    const areaList = [
        "pendowo", "trimulyo", "turi", "pandanaran", "rejodani", 
        "jongke", "kronggahan", "cebongan", "caturharjo", "cemoro"
    ];

    const defaultOmset = [322000, 438000, 3, 467000, 4, 514000, 742000, 4323000, 538000, 1149000];

    function getToday() {
        const d = new Date();
        const options = { day: '2-digit', month: 'long', year: 'numeric' };
        return d.toLocaleDateString('id-ID', options).toUpperCase();
    }

    function init() {
        document.getElementById('displayDate').innerText = getToday();
        renderForms();
    }

    function renderForms() {
        const savedOmset = JSON.parse(localStorage.getItem('jepe_omset_v3'));
        const savedSisa = JSON.parse(localStorage.getItem('jepe_sisa_v3'));

        // Render Omset
        const omsetHtml = areaList.map((area, i) => `
            <div class="row">
                <label>${i + 1}. ${area}</label>
                <input type="number" class="omset-in" value="${savedOmset ? savedOmset[i] : defaultOmset[i]}" oninput="calc()">
            </div>
        `).join('');
        document.getElementById('omsetForm').innerHTML = omsetHtml;

        // Render Sisa
        const sisaHtml = areaList.map((area, i) => `
            <div class="sisa-row">
                <span>${area}</span>
                <div class="input-group">
                    <input type="number" class="sisa-in" value="${savedSisa ? savedSisa[i] : 0}" oninput="saveData(false)">
                    <span>pcs</span>
                </div>
            </div>
        `).join('');
        document.getElementById('sisaForm').innerHTML = sisaHtml;

        calc();
    }

    function calc() {
        let total = 0;
        document.querySelectorAll('.omset-in').forEach(input => {
            total += Number(input.value) || 0;
        });
        document.getElementById('grandTotal').innerText = "Rp" + total.toLocaleString('id-ID');
        saveData(false); // Simpan otomatis tiap ada perubahan tanpa alert
    }

    // Param showAlert untuk menentukan muncul pop-up atau tidak
    function saveData(showAlert) {
        const omsetVals = Array.from(document.querySelectorAll('.omset-in')).map(i => Number(i.value));
        const sisaVals = Array.from(document.querySelectorAll('.sisa-in')).map(i => Number(i.value));
        
        localStorage.setItem('jepe_omset_v3', JSON.stringify(omsetVals));
        localStorage.setItem('jepe_sisa_v3', JSON.stringify(sisaVals));
        
        if(showAlert) alert("Data berhasil disimpan!");
    }

    function copyReport() {
        // Simpan data terbaru tanpa alert
        saveData(false);
        
        let total = document.getElementById('grandTotal').innerText;
        let text = `*OMSET PENJUALAN AYAM BOOTH JEPE FRIED CHICKEN*\n*${getToday()}*\n\n*AREA TIMUR (AWAN)*\n\n`;
        
        const omsetIn = document.querySelectorAll('.omset-in');
        areaList.forEach((area, i) => {
            let val = Number(omsetIn[i].value).toLocaleString('id-ID');
            text += `*${i+1}. ${area}* ${val}\n`;
        });

        text += `___________________________ +\n\nTotal:              *${total}*\n\n*sisa goreng booth area timur*\n\n`;

        const sisaIn = document.querySelectorAll('.sisa-in');
        let adaSisa = false;
        areaList.forEach((area, i) => {
            let jml = Number(sisaIn[i].value);
            if(jml > 0) {
                text += `${area}\n- dada lembut ${jml} pcs\ndibooth\n\n`;
                adaSisa = true;
            }
        });

        if(!adaSisa) text += "(Tidak ada sisa goreng)";

        // Proses Copy ke Clipboard
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        alert("✅ Laporan sudah DISALIN! Silakan buka WhatsApp lalu tempel (paste).");
    }

    function resetData() {
        if(confirm("Hapus semua data dan kembali ke awal?")) {
            localStorage.removeItem('jepe_omset_v3');
            localStorage.removeItem('jepe_sisa_v3');
            location.reload();
        }
    }

    init();
</script>

</body>
</html>
